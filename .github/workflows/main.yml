name: Build and Sign EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish WpfApp1/WpfApp1.csproj -c Release -o publish
      - uses: vedantmgoyal2009/self-sign-codesign@v1
        with:
          path: publish/Ttrad.exe
          name: TVG
      - uses: actions/upload-artifact@v4
        with:
          name: Ttrad-Signed
          path: publish/Ttrad.exe
